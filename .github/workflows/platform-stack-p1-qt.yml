name: Platform Stack P1 Qt

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/platform-stack-p1-qt.yml'
      - 'spikes/platform-stack/qt/**'
      - 'spikes/platform-stack/shared/**'
      - 'spikes/platform-stack/scripts/materialize_cmake_ninja.py'
      - 'spikes/platform-stack/scripts/materialize_noto.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-stack-p1-qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-linux:
    name: P1.3 Qt Linux acquisition + build
    runs-on: [self-hosted, linux, x64, eep-vps]
    timeout-minutes: 25
    env:
      QT_INSTALLER_JWT_TOKEN: ${{ secrets.QT_INSTALLER_JWT_TOKEN }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Exact-head identity and capacity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "exact_head=$EXPECTED_HEAD"
          df -B1 /
          free -b

      - name: Materialize CMake 4.4.2 and Ninja 1.13.2 in runner temp
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOL_ROOT="$RUNNER_TEMP/eep-p1-qt-tools"
          EVIDENCE="$RUNNER_TEMP/eep-p1-qt-evidence"
          rm -rf "$TOOL_ROOT" "$EVIDENCE"
          mkdir -p "$TOOL_ROOT" "$EVIDENCE"
          python3 spikes/platform-stack/scripts/materialize_cmake_ninja.py \
            --platform linux-x64 --root "$TOOL_ROOT" \
            --provenance "$EVIDENCE/cmake-ninja-acquisition.json"
          echo "$TOOL_ROOT/cmake-4.4.2/bin" >> "$GITHUB_PATH"
          echo "$TOOL_ROOT/ninja-1.13.2" >> "$GITHUB_PATH"
          "$TOOL_ROOT/cmake-4.4.2/bin/cmake" --version
          "$TOOL_ROOT/ninja-1.13.2/ninja" --version
          test "$("$TOOL_ROOT/cmake-4.4.2/bin/cmake" --version | head -1)" = 'cmake version 4.4.2'
          test "$("$TOOL_ROOT/ninja-1.13.2/ninja" --version)" = '1.13.2'

      - name: Materialize and verify Noto Sans 2.015
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/eep-p1-qt-evidence"
          FONT_DIR="spikes/platform-stack/qt/fonts"
          rm -rf "$FONT_DIR" && mkdir -p "$FONT_DIR"
          python3 spikes/platform-stack/scripts/materialize_noto.py --destination "$FONT_DIR" --provenance "$EVIDENCE/noto-acquisition.json"
          echo '478c558ea716033cd60c03438f628dfa75694dcf6b5f6d505a2f05fd2b4f3823  spikes/platform-stack/qt/fonts/NotoSans-Regular.ttf' | sha256sum --check -
          echo 'a4e91fd530ac2b4ef5367240144ff37d7d65d66cf76f2e9a2187b93c676f92d0  spikes/platform-stack/qt/fonts/NotoSans-SemiBold.ttf' | sha256sum --check -

      - name: Download and verify frozen Qt Online Installer 4.11.0
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/eep-p1-qt-evidence"
          INSTALLER="$RUNNER_TEMP/qt-online-installer-linux-x64-4.11.0.run"
          URL='https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-4.11.0.run'
          curl --fail --location --retry 2 --output "$INSTALLER" "$URL"
          echo '40b76bdf74f6a396341efb70ae2e754fcd878474babb6cd9d7f07eff12a85c62  '"$INSTALLER" | sha256sum --check -
          chmod +x "$INSTALLER"
          printf '{"schema":"eep.qt-acquisition/v1","installer_version":"4.11.0","installer_url":"%s","installer_sha256":"%s","requested_qt":"6.11.1","requested_component":"qt.qt6.6111.linux_gcc_64"}\n' \
            "$URL" '40b76bdf74f6a396341efb70ae2e754fcd878474babb6cd9d7f07eff12a85c62' > "$EVIDENCE/qt-installer-acquisition.json"

      - name: Require official Qt Account JWT secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QT_INSTALLER_JWT_TOKEN:-}" ]; then
            echo 'BLOCKED_QT_INSTALLER_JWT_TOKEN: GitHub Actions secret QT_INSTALLER_JWT_TOKEN is not configured.' >&2
            exit 78
          fi
          echo 'QT_INSTALLER_JWT_TOKEN is configured (value intentionally not printed).'

      - name: Acquire Qt 6.11.1 linux_gcc_64 user-scoped
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="$RUNNER_TEMP/qt-online-installer-linux-x64-4.11.0.run"
          QT_ROOT="$RUNNER_TEMP/eep-p1-qt-6.11.1"
          rm -rf "$QT_ROOT"
          timeout 900s "$INSTALLER" \
            --root "$QT_ROOT" \
            --accept-licenses --accept-obligations --default-answer --confirm-command \
            install qt.qt6.6111.linux_gcc_64
          QT_DIR="$QT_ROOT/6.11.1/gcc_64"
          test -x "$QT_DIR/bin/qtpaths"
          test "$($QT_DIR/bin/qtpaths --qt-version)" = '6.11.1'
          echo "$QT_DIR/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_DIR" >> "$GITHUB_ENV"
          echo "QT_P1_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          echo "QT_P1_DIR=$QT_DIR" >> "$GITHUB_ENV"

      - name: Configure and build Qt Release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S spikes/platform-stack/qt -B "$RUNNER_TEMP/eep-p1-qt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_P1_DIR"
          cmake --build "$RUNNER_TEMP/eep-p1-qt-build" --parallel 4

      - name: Run Qt fixture/behavior smoke
        shell: bash
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen timeout 60s "$RUNNER_TEMP/eep-p1-qt-build/eep-p1-qt-smoke" -o -,txt

      - name: Capture Qt installed-payload provenance
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/eep-p1-qt-evidence"
          mkdir -p "$EVIDENCE/qt-payload"
          "$QT_P1_DIR/bin/qtpaths" --qt-version > "$EVIDENCE/qt-payload/qt-version.txt"
          find "$QT_P1_ROOT" -maxdepth 4 -type f \( -iname '*spdx*' -o -iname '*sbom*' -o -name 'components.xml' -o -name 'InstallationLog.txt' \) -print | sort > "$EVIDENCE/qt-payload/provenance-files.txt"
          while IFS= read -r f; do [ -f "$f" ] && cp --parents "$f" "$EVIDENCE/qt-payload/" || true; done < "$EVIDENCE/qt-payload/provenance-files.txt"
          find "$QT_P1_DIR" -maxdepth 2 -type f \( -name 'Qt6*Config.cmake' -o -name 'qtpaths' -o -name 'qml' \) -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE/qt-payload/key-files.sha256" || true
          ldd "$RUNNER_TEMP/eep-p1-qt-build/eep-p1-qt" > "$EVIDENCE/runtime-ldd.txt" || true
          sha256sum "$RUNNER_TEMP/eep-p1-qt-build/eep-p1-qt" "$RUNNER_TEMP/eep-p1-qt-build/eep-p1-qt-smoke" > "$EVIDENCE/build-artifacts.sha256"
          python3 - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess
          from pathlib import Path
          ev = Path(os.environ['RUNNER_TEMP']) / 'eep-p1-qt-evidence'
          fixture = Path('spikes/platform-stack/shared/fixtures/p1-shell-fixture.json')
          rec = {
            'schema':'eep.environment/v1','work_item':'PLATFORM-STACK-SPIKE-001','candidate':'qt',
            'git_sha':os.environ['EXACT_HEAD'],'run_id':os.environ['GITHUB_RUN_ID'],
            'timestamp_utc':subprocess.check_output(['date','-u','+%Y-%m-%dT%H:%M:%SZ'],text=True).strip(),
            'os':{'name':'Ubuntu','version':'24.04.4 LTS','build':'','kernel':platform.release(),'arch':platform.machine()},
            'host':{'cpu_model':next((l.split(':',1)[1].strip() for l in Path('/proc/cpuinfo').read_text().splitlines() if l.startswith('model name')),'unknown'),'logical_cpus':os.cpu_count(),'ram_bytes':int(subprocess.check_output("awk '/MemTotal/ {print $2*1024}' /proc/meminfo,shell=True,text=True).strip().split('.')[0]),'disk_free_bytes':shutil.disk_usage('/').free},
            'gpu':[],'displays':[],
            'toolchain':{'dotnet_sdk':None,'dotnet_runtime':None,'compiler':subprocess.check_output(['g++','--version'],text=True).splitlines()[0],'compiler_detail':subprocess.check_output(['g++','--version'],text=True).splitlines()[0],'windows_sdk':None,'cmake':subprocess.check_output(['cmake','--version'],text=True).splitlines()[0].split()[-1],'ninja':subprocess.check_output(['ninja','--version'],text=True).strip(),'runner_image':None},
            'framework':{'name':'qt','version':'6.11.1'},'build':{'configuration':'Release','options':{'cxx':'20','generator':'Ninja'}},
            'renderer':{'name':'Qt offscreen behavior smoke','backend':'offscreen','software':True},
            'fixture':{'schema':'eep.p1-shell-fixture/v1','manifest_sha256':hashlib.sha256(fixture.read_bytes()).hexdigest()},
            'font':{'family':'Noto Sans','version':'2.015','files_sha256':['478c558ea716033cd60c03438f628dfa75694dcf6b5f6d505a2f05fd2b4f3823','a4e91fd530ac2b4ef5367240144ff37d7d65d66cf76f2e9a2187b93c676f92d0']}
          }
          (ev/'environment.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload Qt Linux acquisition/build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p1-qt-linux-materialization
          path: ${{ runner.temp }}/eep-p1-qt-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean user-scoped Qt/tool materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/eep-p1-qt-tools" "$RUNNER_TEMP/eep-p1-qt-evidence" "$RUNNER_TEMP/eep-p1-qt-build" "$RUNNER_TEMP/eep-p1-qt-6.11.1"
          rm -f "$RUNNER_TEMP/qt-online-installer-linux-x64-4.11.0.run"
          rm -rf spikes/platform-stack/qt/fonts
          echo 'P1 Qt temporary acquisition cleaned; no system packages changed.'
