name: Infrastructure Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted-smoke:
    name: eep-vps exact-head smoke
    runs-on: [self-hosted, linux, x64, eep-vps]
    timeout-minutes: 5

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "host=$(hostname)"
          test "$(id -un)" = "eep-runner"
          test "$(hostname)" = "eod-development-vps"

      - name: Verify exact PR head against GitHub
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$({
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          })"
          echo "expected_head=${EXPECTED_HEAD}"
          echo "actual_head=${ACTUAL_HEAD}"
          test "${ACTUAL_HEAD}" = "${EXPECTED_HEAD}"

      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify checked-out HEAD
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_HEAD="$(git rev-parse HEAD)"
          echo "expected_checkout=${EXPECTED_HEAD}"
          echo "checked_out_head=${LOCAL_HEAD}"
          test "${LOCAL_HEAD}" = "${EXPECTED_HEAD}"
          test -z "$(git status --porcelain)"

      - name: Test bounded Development Bridge source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/development_bridge
          python3 -m unittest discover -s tools/development_bridge/tests -v
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/development_bridge/app.py').read_text(encoding='utf-8')
          forbidden = ('shell=True', 'os.system(', 'subprocess.getoutput(', 'subprocess.getstatusoutput(')
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f'forbidden arbitrary-command primitive(s): {found}')
          print('bridge_static_command_policy=pass')
          PY

      - name: Verify runner credential isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HOME/.ssh/eep_github_ed25519"
          echo "persistent_deploy_key=absent"

      - name: Verify Development Bridge service remains active
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet eep-dev-bridge.service
          echo "eep-dev-bridge.service=active"

      - name: Inspect Development Bridge runtime surface
        shell: bash
        run: |
          set -u
          echo "--- systemd metadata ---"
          systemctl show eep-dev-bridge.service \
            --property=User \
            --property=Group \
            --property=FragmentPath \
            --property=WorkingDirectory \
            --property=ExecStart \
            --no-pager
          echo "--- deployment root ---"
          stat -c '%A %U:%G %n' /opt/eep-dev-bridge 2>&1 || true
          find /opt/eep-dev-bridge -maxdepth 1 -type f \
            -printf '%M %u:%g %f\n' 2>&1 | sort || true
          echo "--- unauthenticated localhost surface ---"
          for path in /health /status /openapi.json /docs /redoc; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8788${path}" 2>/dev/null || true)"
            printf '%s=%s\n' "$path" "${code:-request_failed}"
          done
          echo "--- OpenAPI path/method inventory ---"
          curl --silent --show-error http://127.0.0.1:8788/openapi.json 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(f"{m.upper()} {p}") for p,ops in sorted(d.get("paths",{}).items()) for m in sorted(ops) if m.lower() in {"get","post","put","patch","delete"}]' \
            || true

      - name: Exercise deliberate failure diagnostics
        id: deliberate_failure
        continue-on-error: true
        shell: bash
        run: |
          echo "intentional smoke failure: diagnostic-path-check" >&2
          exit 17

      - name: Assert deliberate failure was observed
        env:
          FAILURE_OUTCOME: ${{ steps.deliberate_failure.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "deliberate_failure_outcome=${FAILURE_OUTCOME}"
          test "${FAILURE_OUTCOME}" = "failure"

      - name: Build evidence file
        if: always()
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/infrastructure-smoke"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          CHECKED_OUT_HEAD="unknown"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          fi
          {
            echo "work_item=INFRASTRUCTURE-SPIKE-001"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "host=$(hostname)"
            echo "user=$(id -un)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "event_sha=${GITHUB_SHA}"
            echo "expected_head=${EXPECTED_HEAD}"
            echo "checked_out_head=${CHECKED_OUT_HEAD}"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "pr_head=${{ github.event.pull_request.head.sha }}"
            fi
            echo "bridge_source_policy=pass"
            echo "persistent_deploy_key=absent"
            echo "development_bridge=active"
            echo "deliberate_failure_path=observed"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/evidence.txt"
          sha256sum "$EVIDENCE_DIR/evidence.txt" > "$EVIDENCE_DIR/evidence.sha256"
          cat "$EVIDENCE_DIR/evidence.txt"

      - name: Upload smoke evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-smoke-evidence
          path: ${{ runner.temp }}/infrastructure-smoke/
          if-no-files-found: error
          retention-days: 3

      - name: Write GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## INFRASTRUCTURE-SPIKE-001 smoke"
            echo
            echo "- Runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- Host: \`$(hostname)\`"
            echo "- User: \`$(id -un)\`"
            echo "- Event SHA: \`${GITHUB_SHA}\`"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "- Checked-out HEAD: \`$(git rev-parse HEAD)\`"
            fi
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "- PR head: \`${{ github.event.pull_request.head.sha }}\`"
            fi
            echo "- Bridge source compile/unit/static policy: checked"
            echo "- Persistent deploy key under runner account: absent"
            echo "- Development Bridge service: checked"
            echo "- Deliberate failure path: exercised with continue-on-error"
            echo "- Evidence artifact: \`infrastructure-smoke-evidence\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean smoke temporary evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/infrastructure-smoke"
          test ! -e "$RUNNER_TEMP/infrastructure-smoke"
          echo "temporary_evidence=clean"
