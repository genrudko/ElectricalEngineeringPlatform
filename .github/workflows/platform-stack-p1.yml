name: Platform Stack P1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/platform-stack-p1.yml'
      - 'spikes/platform-stack/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-stack-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-preflight:
    name: P1.0 Linux pre-install preflight
    runs-on: [self-hosted, linux, x64, eep-vps]
    timeout-minutes: 5

    steps:
      - name: Runner and exact-head identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "user=$(id -un)"
          echo "uid=$(id -u)"
          echo "host=$(hostname)"
          test "$(id -un)" = "eep-runner"
          test "$(hostname)" = "eod-development-vps"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ACTUAL_HEAD="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            echo "expected_head=${EXPECTED_HEAD}"
            echo "actual_head=${ACTUAL_HEAD}"
            test "${ACTUAL_HEAD}" = "${EXPECTED_HEAD}"
          fi

      - name: Checkout exact event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: System capacity and existing tool inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '=== OS ==='
          cat /etc/os-release
          uname -a
          echo '=== CPU ==='
          nproc
          lscpu | sed -n '1,30p'
          echo '=== MEMORY ==='
          free -b
          echo '=== DISK ==='
          df -B1 /
          echo '=== EXISTING TOOLS ==='
          for cmd in git python3 gcc g++ dotnet cmake ninja qmake6 qtpaths6 Xvfb fc-list; do
            printf '%-12s ' "$cmd"
            if command -v "$cmd" >/dev/null 2>&1; then command -v "$cmd"; else echo MISSING; fi
          done
          git --version
          python3 --version
          gcc --version | head -1
          g++ --version | head -1
          command -v dotnet >/dev/null 2>&1 && dotnet --info || true
          command -v cmake >/dev/null 2>&1 && cmake --version || true
          command -v ninja >/dev/null 2>&1 && ninja --version || true
          command -v qmake6 >/dev/null 2>&1 && qmake6 -v || true
          command -v qtpaths6 >/dev/null 2>&1 && qtpaths6 --qt-version || true

      - name: Native desktop dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxi6
            libfontconfig1 libfreetype6 libice6 libsm6
            libxkbcommon0 libxkbcommon-x11-0
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1
            libgl1 libglx0 libegl1 libopengl0
            libdbus-1-3 libglib2.0-0
            xvfb xauth
          )
          missing=0
          for pkg in "${packages[@]}"; do
            if dpkg-query -W -f='${Status} ${Version}\n' "$pkg" 2>/dev/null | grep -q '^install ok installed '; then
              printf 'PRESENT %-28s ' "$pkg"
              dpkg-query -W -f='${Version}\n' "$pkg"
            else
              printf 'MISSING %-28s\n' "$pkg"
              missing=$((missing+1))
            fi
          done
          echo "inventory_missing_count=${missing}"
          echo '=== FONTCONFIG ==='
          command -v fc-list >/dev/null 2>&1 && { fc-match sans; fc-list | head -20 || true; } || true
          echo '=== DISPLAY/GL LIBRARY CACHE ==='
          ldconfig -p 2>/dev/null | grep -E 'lib(X11|xcb|xkbcommon|fontconfig|freetype|GL|EGL|OpenGL|dbus|glib)' | head -80 || true
          echo 'NOTE: inventory only; no package installation or configuration change performed.'
